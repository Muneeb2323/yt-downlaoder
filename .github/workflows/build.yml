name: Build Windows exe

on:
  push:
    branches: [main]
  # Rebuild weekly. yt-dlp is bundled into the exe, and YouTube changes often
  # enough that a months-old yt-dlp is the usual reason downloads stop working.
  # A scheduled rebuild keeps the published exe no more than a week behind.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity-check the sources before bundling
        run: |
          python -m py_compile yt2tv.py setup.py

      # --collect-all yt_dlp is required: yt-dlp loads its extractors
      # dynamically, so PyInstaller's static analysis misses nearly all of
      # them and the exe would build fine but fail on every link.
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --console
          --name yt2tv
          --collect-all yt_dlp
          --collect-all yt_dlp_ejs
          --hidden-import setup
          --hidden-import unidecode
          yt2tv.py

      - name: Check the exe actually starts
        shell: bash
        run: |
          # No link given: it should print its banner and exit cleanly rather
          # than crash, which catches a missing bundled import.
          echo "" | ./dist/yt2tv.exe || true
          test -f dist/yt2tv.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt2tv-windows
          path: dist/yt2tv.exe

      - name: Publish to the rolling "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest Windows build. Download **yt2tv.exe**, put it in an empty folder and run it. On first launch it downloads ffmpeg and Deno itself; after that it starts straight away. No Python needed.

          Windows SmartScreen warns about unrecognised apps because the exe is not code-signed — choose **More info → Run anyway**."

          gh release create latest --title "yt2tv (latest build)" --notes "$NOTES" \
            || gh release edit latest --title "yt2tv (latest build)" --notes "$NOTES"

          # Drop anything left over from an earlier name or build, so the page
          # only ever offers the current exe.
          gh release view latest --json assets -q '.assets[].name' \
            | grep -vx 'yt2tv.exe' \
            | while read -r stale; do
                [ -n "$stale" ] && gh release delete-asset latest "$stale" --yes
              done || true

          gh release upload latest dist/yt2tv.exe --clobber
